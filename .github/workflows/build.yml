name: Build Luminus Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.6'
      
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev \
            libwayland-dev libxkbcommon-dev
      
      - name: Configure (CMake)
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: cmake --build build --config Release --parallel 4
      
      - name: Package artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifact
          cp build/bin/luminus artifact/
          cp -r assets examples artifact/ 2>/dev/null || true
          cd artifact && tar czf ../luminus-${{ runner.os }}.tar.gz *
      
      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir artifact
          copy build\bin\Release\luminus.exe artifact\
          xcopy /E /I assets artifact\assets 2>nul || true
          xcopy /E /I examples artifact\examples 2>nul || true
          cd artifact && 7z a ..\luminus-Windows.zip *
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luminus-${{ runner.os }}
          path: |
            luminus-*.tar.gz
            luminus-*.zip
          retention-days: 30
